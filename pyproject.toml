[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2trace"
version = "0.1.0"
description = "Evidence-grounded investigation and verified response to C2 alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography==49.0.0", "mcp==1.28.1", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
baseline = ["langgraph>=1,<2", "langchain-openai>=1,<2", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
